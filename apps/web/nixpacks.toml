[buildpacks]
buildpacks = ["custom", "nix"]

[phases.setup]
nixPkgs = ["bun"]

[phases.install]
cmds = [
  "bun i --no-save --ignore-scripts"
]

[phases.build]
cmds = [
  "bun run --filter @bozorchi/web generate:types",
  "NODE_ENV=production NODE_OPTIONS='--max-old-space-size=2048' bun run build"
]

[start]
cmd = "bun run preview -- --host 0.0.0.0 --port 3000"