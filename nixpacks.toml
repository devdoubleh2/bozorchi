[buildpacks]
buildpacks = ["custom", "nix"]

[phases.setup]
nixPkgs = ["bun"]

[phases.install]
cmds = [
  "bun install --frozen-lockfile"
]

[phases.build]
cmds = [
  "bun run --filter @bozorchi/shared build",
  "bun run --filter @bozorchi/web generate:types",
  "NODE_ENV=production NODE_OPTIONS='--max-old-space-size=2048' bun run --filter @bozorchi/web build"
]

[start]
cmd = "bun run --filter @bozorchi/web preview -- --host 0.0.0.0 --port 3000"
